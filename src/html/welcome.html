<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/welcome.css" />
    <script src="../js/static/jquery-3.3.1.min.js"></script>
  </head>

  <body>
    <div class="container">
      <!-- Header Section -->
      <div class="header-section">
        <h1 id="title">Leet<span class="brand-accent">Hub</span> 5.0</h1>
        <p class="caption">Automatically sync your code from coding platforms to GitHub</p>
      </div>

      <!-- Messages -->
      <div id="error" class="alert-badge" style="display: none"></div>
      <div id="success" class="alert-badge" style="display: none"></div>
      <div id="unlink" class="alert-badge" style="display: none">
        Linked the wrong repo? <a>Unlink</a>
      </div>

      <!-- Create Hook Mode -->
      <div id="hook_mode" class="glass-card" style="display: none">
        <h2>To get started with LeetHub</h2>

        <div class="form-group">
          <select id="type">
            <option value="">Pick an Option</option>
            <option value="new">Create a new Private Repository</option>
            <option value="link">Link an Existing Repository</option>
          </select>

          <input
            autocomplete="off"
            id="name"
            placeholder="Repository Name"
            type="text"
            style="display: none"
          />

          <select id="existing_repo" style="display: none">
            <option value="">Select a Repository</option>
            <!-- Repositories will be populated here -->
          </select>
        </div>

        <button id="hook_button" disabled class="primary-btn accent">Get Started</button>
      </div>

      <!-- Commit Mode (Stats) -->
      <div id="commit_mode" class="glass-card" style="display: none">
        <div class="stats-container">
          <div class="stats-total-header">Problems Solved</div>
          <span id="p_solved">0</span>

          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label text-easy">Easy</span>
              <span class="stat-value text-easy" id="p_solved_easy">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label text-medium">Medium</span>
              <span class="stat-value text-medium" id="p_solved_medium">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label text-hard">Hard</span>
              <span class="stat-value text-hard" id="p_solved_hard">0</span>
            </div>
          </div>

          <span class="sync-link" id="sync_counts">Sync Problem Counts</span>
        </div>
      </div>

      <!-- Footer Link -->
      <div class="footer-link">
        <a target="_blank" href="https://github.com/14-Tanmay/LeetHubV5">
          Star <span style="color: white; font-weight: 600">Leet</span
          ><span class="brand-accent" style="font-weight: 800">Hub</span> on GitHub
        </a>
      </div>
    </div>

    <script type="text/javascript" src="../js/welcome.js"></script>
  </body>
</html>
